services:
  db:
    image: postgres:16
    container_name: pg-peng
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: penguins
    ports:
      - "5432:5432"
    volumes:
      - pg-peng-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d penguins"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: penguins-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:motdepasse@db:5432/penguins
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-peng-data: